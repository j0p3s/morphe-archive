version: 2

# The Morphe Gradle plugin and libraries (app.morphe:*) are only published to the MorpheApp
# GitHub Packages registry, which needs a token even for public packages. The two values are
# Dependabot secrets (Settings > Secrets and variables > Dependabot), not Actions secrets.
registries:
  morphe-registry:
    type: maven-repository
    url: https://maven.pkg.github.com/MorpheApp/registry
    username: ${{secrets.DEPENDABOT_GPR_USER}}
    password: ${{secrets.DEPENDABOT_GPR_TOKEN}}

updates:
  - package-ecosystem: github-actions
    labels: []
    directory: /
    target-branch: dev
    schedule:
      interval: monthly

  - package-ecosystem: npm
    labels: []
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    ignore:
      # version 10.x and later may not generate release notes correctly
      # https://github.com/conventional-changelog/conventional-changelog/issues/1495
      - dependency-name: "conventional-changelog-conventionalcommits"

  - package-ecosystem: gradle
    labels: []
    directory: /
    target-branch: dev
    registries:
      - morphe-registry
    schedule:
      interval: monthly
