name: Verify stable bundle metadata

# The Morphe Manager reads patches-bundle.json from `main` for the stable channel and from
# `dev` when the per-source "Pre-release patches" toggle is on. If `main` ever advertises a
# prerelease version (that is what broke issue #11: main pointed at v1.1.0-dev.2), users
# adding the source as stable get a bundle they cannot use.
#
# This check runs after every Release run on main (success or failure, since a release can
# publish and then fail in a later step) and daily, so a stuck/incorrect stable channel is
# caught even when no release is being cut.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  schedule:
    # Daily at 07:00 UTC, after the usual release window.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: main points at a stable, downloadable bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check main's patches-bundle.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Read through the API, not raw.githubusercontent.com: the raw CDN caches per path and
          # ignores cache-busting query strings, so it can serve a stale file right after a release.
          json="$(gh api "repos/${REPO}/contents/patches-bundle.json?ref=main" -H 'Accept: application/vnd.github.raw')"
          version="$(jq -r '.version // ""' <<<"$json")"
          download="$(jq -r '.download_url // ""' <<<"$json")"
          echo "main channel: ${version} -> ${download}"

          case "$version" in
            "")
              echo "::error::main's patches-bundle.json has no version"
              exit 1
              ;;
            *-*)
              echo "::error::main's patches-bundle.json advertises prerelease '${version}'"
              exit 1
              ;;
          esac

          expected="v${version}/patches-${version}.mpp"
          case "$download" in
            *"$expected"*) ;;
            *)
              echo "::error::main's download_url '${download}' does not point at ${expected}"
              exit 1
              ;;
          esac

          prerelease="$(gh release view "v${version}" --repo "$REPO" --json isPrerelease --jq '.isPrerelease')"
          if [ "$prerelease" != "false" ]; then
            echo "::error::GitHub release v${version} is marked as a prerelease (isPrerelease=${prerelease})"
            exit 1
          fi

          curl -fsIL "$download" -o /dev/null
          echo "OK: main advertises stable ${version}, its release is not a prerelease and its bundle is downloadable"
