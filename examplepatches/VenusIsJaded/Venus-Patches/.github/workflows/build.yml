name: Build Venus Patches

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js & Java 21
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache build toolchains & hermesc
        uses: actions/cache@v4
        with:
          path: work/tools
          key: venus-tools-hbc98-v1-${{ hashFiles('scripts/build.py') }}

      - name: Download pinned hermesc (HBC98 / 250829098.0.19)
        run: |
          mkdir -p work/tools
          if [ ! -x work/tools/hermesc ]; then
            curl -fsSL "https://registry.npmjs.org/hermes-compiler/-/hermes-compiler-250829098.0.19.tgz" -o work/tools/hermes-compiler.tgz
            echo "839af099f0926b5ebbd738ba54764a3f40e35dfc3aac91babf56f8eb7c69280e  work/tools/hermes-compiler.tgz" | sha256sum -c -
            tar -xzf work/tools/hermes-compiler.tgz -C work/tools --strip-components=3 package/hermesc/linux64-bin/hermesc
            chmod +x work/tools/hermesc
          fi
          work/tools/hermesc --version

      - name: Build and test .mpp bundle
        run: python3 scripts/build.py

      - name: Precompile Venus runtime to HBC98 (bootstrap.hbc)
        run: |
          sed 's|/\*__FEATURES__\*/|globalThis.__venusFeatures|g' patches/build/bootstrap.js > patches/build/bootstrap.precompile.js
          work/tools/hermesc -emit-binary -O -g0 -w \
            -out=patches/build/bootstrap.hbc \
            patches/build/bootstrap.precompile.js
          ls -lh patches/build/bootstrap.hbc

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: venus-patches-mpp
          path: |
            patches/build/libs/*.mpp
            patches/build/libs/SHA256SUMS
            patches/build/bootstrap.hbc

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/release_notes.py "$VERSION" > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" \
            "patches/build/libs/patches-${VERSION}.mpp" \
            --title "$VERSION" \
            --notes-file /tmp/notes.md
