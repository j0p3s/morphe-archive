name: Morphe bundle issue triage
description: >-
  Checks a bug report against the bundle's patches-list.json, then comments, labels, closes or
  reopens the issue. Works with any Morphe patch bundle's issue forms.

inputs:
  registry:
    description: URL of the public bundle registry used to spot apps other bundles already patch.
    default: https://morphe-patches.software/data/bundles.json
  token:
    description: Token used to comment, label and close. Needs issues:write.
    required: true
  patches-list:
    description: Path to the bundle's patches-list.json in the checked-out repo.
    default: patches-list.json
  dry-run:
    description: Print app request verdicts without commenting, labeling or closing.
    default: "false"

runs:
  using: composite
  steps:
    - name: Triage app requests
      if: >-
        github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
        contains(github.event.issue.labels.*.name, 'app request')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ISSUE: ${{ github.event.issue.number }}
        REPO: ${{ github.repository }}
        REGISTRY: ${{ inputs.registry }}
        PATCHES_LIST: ${{ inputs.patches-list }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        list="$PWD/$PATCHES_LIST"
        cd "$RUNNER_TEMP"
        curl -sSL --max-time 30 -H "Referer: https://morphe-patches.software/" \
          -H "Accept: application/json" \
          -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36" \
          "$REGISTRY" -o bundles.json || rm -f bundles.json
        gh issue list --repo "$REPO" --label "app request" --state all --limit 1000 \
          --json number,title,body,state,labels,comments > requests.json

        if [ -n "$ISSUE" ]; then
          targets=$ISSUE
        else
          targets=$(jq -r 'map(select(.state == "OPEN")) | sort_by(.number) | .[].number' requests.json)
        fi

        for n in $targets; do
          jq -e --argjson n "$n" \
            '.[] | select(.number == $n) | .labels | map(.name) | index("bot-wrong")' \
            requests.json >/dev/null && continue
          jq -r --argjson n "$n" '.[] | select(.number == $n) | .body // ""' requests.json > body.md
          python3 "${{ github.action_path }}/app_request.py" \
            "$n" body.md requests.json "$list" bundles.json > verdict.json
          verdict=$(jq -r .verdict verdict.json)
          jq -j .comment verdict.json > comment.md
          previous=$(gh api "repos/$REPO/issues/$n/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- app-request-bot -->"))) | .body | @json' |
            tail -n 1 | jq -r '. // empty')
          if [ "$verdict" = pass ] && [ ! -s comment.md ] && [ -n "$previous" ]; then
            printf '<!-- app-request-bot -->\nThis app request now passes the automated checks.\n' > comment.md
          fi
          [ -z "$ISSUE" ] && [ "$verdict" = pass ] && [ -z "$previous" ] && continue
          echo "#$n: $(jq -c 'del(.comment)' verdict.json)"
          [ "$DRY_RUN" = "true" ] && continue

          if [ -s comment.md ] && [ "$(cat comment.md)" != "$previous" ]; then
            gh issue comment "$n" --repo "$REPO" --body-file comment.md
            labels=$(jq -r '.labels | join(",")' verdict.json)
            [ -n "$labels" ] && gh issue edit "$n" --repo "$REPO" --add-label "$labels"
          fi
          if [ -n "$previous" ]; then
            jq -r --argjson n "$n" '.[] | select(.number == $n) | .labels[].name' requests.json |
            while read -r label; do
              case "$label" in "needs info"|duplicate) ;; *) continue ;; esac
              jq -e --arg l "$label" '.labels | index($l)' verdict.json >/dev/null && continue
              added_by=$(gh api "repos/$REPO/issues/$n/timeline" --paginate \
                --jq ".[] | select(.event == \"labeled\" and .label.name == \"$label\") | .actor.login" | tail -n 1)
              [ "$added_by" = "github-actions[bot]" ] && gh issue edit "$n" --repo "$REPO" --remove-label "$label"
              true
            done
          fi
          if [ "$verdict" = close ]; then
            if [ "$(jq -r .reason verdict.json)" = duplicate ]; then
              gh issue close "$n" --repo "$REPO" --duplicate-of "$(jq -r .duplicate_of verdict.json)"
            else
              gh issue close "$n" --repo "$REPO" --reason "$(jq -r .reason verdict.json)"
            fi
          fi
        done

    - name: Triage app update requests
      if: >-
        contains(github.event.issue.labels.*.name, 'app-update') &&
        !contains(github.event.issue.labels.*.name, 'bot-wrong') &&
        github.event.issue.user.type != 'Bot' &&
        !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ISSUE: ${{ github.event.issue.number }}
        REPO: ${{ github.repository }}
        PATCHES_LIST: ${{ inputs.patches-list }}
      run: |
        list="$PWD/$PATCHES_LIST"
        cd "$RUNNER_TEMP"
        jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" > body.md
        gh issue list --repo "$REPO" --label app-update --state open --limit 1000 \
          --json number,title,state > updates.json
        python3 "${{ github.action_path }}/app_update.py" "$ISSUE" body.md updates.json "$list" > verdict.json
        verdict=$(jq -r .verdict verdict.json)
        jq -j .comment verdict.json > comment.md
        echo "#$ISSUE: $(jq -c 'del(.comment)' verdict.json)"

        previous=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
          --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- app-update-bot -->"))) | .body | @json' |
          tail -n 1 | jq -r '. // empty')
        post_comment() {
          [ "$(cat comment.md)" = "$previous" ] || gh issue comment "$ISSUE" --repo "$REPO" --body-file comment.md
        }

        case "$verdict" in
          close)
            retitle=$(jq -r '.retitle.number // empty' verdict.json)
            [ -n "$retitle" ] && gh issue edit "$retitle" --repo "$REPO" --title "$(jq -r .retitle.title verdict.json)"
            post_comment
            if [ "$(jq -r .reason verdict.json)" = duplicate ]; then
              gh issue close "$ISSUE" --repo "$REPO" --duplicate-of "$(jq -r .duplicate_of verdict.json)"
            else
              gh issue close "$ISSUE" --repo "$REPO" --reason "$(jq -r .reason verdict.json)"
            fi
            ;;
          flag)
            post_comment
            gh issue edit "$ISSUE" --repo "$REPO" --add-label "$(jq -r '.labels | join(",")' verdict.json)"
            ;;
          pass)
            title=$(jq -r .title verdict.json)
            [ "$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")" = "$title" ] || gh issue edit "$ISSUE" --repo "$REPO" --title "$title"
            if [ -n "$previous" ]; then
              jq -e '.issue.labels | map(.name) | index("needs info")' "$GITHUB_EVENT_PATH" >/dev/null &&
                gh issue edit "$ISSUE" --repo "$REPO" --remove-label "needs info"
              printf '<!-- app-update-bot -->\nThis app update request now passes the automated checks.\n' > comment.md
              post_comment
            fi
            ;;
        esac

    - name: Check the report
      if: >-
        contains(github.event.issue.labels.*.name, 'bug')
      shell: bash
      env:
        PATCHES_LIST: ${{ inputs.patches-list }}
      run: |
        jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/issue-body.md"
        python3 "${{ github.action_path }}/triage.py" \
          "$RUNNER_TEMP/issue-body.md" "$PATCHES_LIST" > "$RUNNER_TEMP/verdict.json"

    - name: Act on the verdict
      if: >-
        contains(github.event.issue.labels.*.name, 'bug')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ISSUE: ${{ github.event.issue.number }}
        REPO: ${{ github.repository }}
        ACTION: ${{ github.event.action }}
        WAS_CLOSED_BY_BOT: ${{ github.event.issue.state == 'closed' && contains(github.event.issue.labels.*.name, 'incomplete') }}
      run: |
        cd "$RUNNER_TEMP"
        verdict=$(jq -r .verdict verdict.json)
        jq -r .comment verdict.json > comment.md

        if [ "$WAS_CLOSED_BY_BOT" = "true" ]; then
          closer=$(gh api "repos/$REPO/issues/$ISSUE/timeline" --paginate \
            --jq '.[] | select(.event == "closed") | .actor.login' | tail -1)
          [ "$closer" = "github-actions[bot]" ] || WAS_CLOSED_BY_BOT=false
        fi

        app=$(jq -r .app verdict.json)
        if [ -n "$app" ] && [ "$verdict" != "pass" ] && [ "$ACTION" = "opened" ]; then
          dupes=$(gh search issues "$app" --repo "$REPO" --limit 4 --json number,title --jq \
            "map(select(.number != $ISSUE)) | .[0:3] | map(\"- [#\(.number)](https://redirect.github.com/$REPO/issues/\(.number)) \`\(.title | gsub(\"\`\"; \"'\"))\`\") | join(\"\n\")")
          if [ -n "$dupes" ]; then
            printf '\nThese issues matched a search for %s:\n%s\n' "$app" "$dupes" >> comment.md
          fi
        fi

        previous=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
          --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- triage-bot -->"))) | .body | @json' |
          tail -n 1 | jq -r '. // empty')

        without_related() {
          sed '/^These issues matched a search for /,$d'
        }
        post_comment() {
          [ "$(without_related < comment.md)" = "$(printf '%s\n' "$previous" | without_related)" ] ||
            gh issue comment "$ISSUE" --repo "$REPO" --body-file comment.md
        }

        case "$verdict" in
          close)
            post_comment
            gh issue edit "$ISSUE" --repo "$REPO" --add-label incomplete
            gh issue close "$ISSUE" --repo "$REPO" --reason "not planned"
            ;;
          flag)
            post_comment
            labels=$(jq -r '.labels | join(",")' verdict.json)
            [ -n "$labels" ] && gh issue edit "$ISSUE" --repo "$REPO" --add-label "$labels"
            [ -n "$previous" ] && jq -r '.issue.labels[].name' "$GITHUB_EVENT_PATH" | while read -r label; do
              case "$label" in "needs info"|"untargeted version") ;; *) continue ;; esac
              jq -e --arg l "$label" '.labels | index($l)' verdict.json >/dev/null && continue
              added_by=$(gh api "repos/$REPO/issues/$ISSUE/timeline" --paginate \
                --jq ".[] | select(.event == \"labeled\" and .label.name == \"$label\") | .actor.login" | tail -n 1)
              [ "$added_by" = "github-actions[bot]" ] && gh issue edit "$ISSUE" --repo "$REPO" --remove-label "$label"
              true
            done
            if [ "$WAS_CLOSED_BY_BOT" = "true" ]; then
              gh issue reopen "$ISSUE" --repo "$REPO"
              gh issue edit "$ISSUE" --repo "$REPO" --remove-label incomplete
            fi
            ;;
          pass)
            if [ "$WAS_CLOSED_BY_BOT" = "true" ] || [ -n "$previous" ]; then
              gh issue edit "$ISSUE" --repo "$REPO" \
                --remove-label incomplete \
                --remove-label "needs info" \
                --remove-label "untargeted version" || true
            fi
            if [ "$WAS_CLOSED_BY_BOT" = "true" ]; then
              gh issue reopen "$ISSUE" --repo "$REPO"
              printf '<!-- triage-bot -->\nThis issue was reopened because the report now passes the automated checks.\n' > comment.md
              post_comment
            elif [ -n "$previous" ]; then
              printf '<!-- triage-bot -->\nThis bug report now passes the automated checks.\n' > comment.md
              post_comment
            fi
            ;;
        esac
