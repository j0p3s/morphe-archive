name: Close stale issues and lock closed ones

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Print what would be marked, closed or locked without doing it
        type: boolean
        default: true

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          debug-only: ${{ inputs.dry-run || false }}
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: |
            no activity for 30 days. it closes in 7 unless someone comments
          close-issue-message: |
            no activity for 37 days
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-all-assignees: true
          exempt-all-milestones: true
          exempt-issue-labels: "app request,needs info,app-update"
          operations-per-run: 30
      - uses: actions/stale@v11
        with:
          debug-only: ${{ inputs.dry-run || false }}
          only-labels: "needs info"
          days-before-issue-stale: 14
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: |
            still waiting on the details asked for above. it closes in 7 days without them
          close-issue-message: |
            the requested details never arrived
          close-issue-reason: not_planned
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-all-assignees: true
          exempt-issue-labels: "bot-wrong"
          operations-per-run: 30

  lock:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run || false }}
        run: |
          gh label create discussion --repo "$REPO" --force --color C5DEF5 \
            --description "Not locked after closing, comments welcome"
          cutoff=$(date -u -d '7 days ago' +%F)
          gh issue list --repo "$REPO" --state closed --limit 50 --json number \
            --search "is:unlocked -label:discussion updated:<$cutoff" --jq '.[].number' |
          while read -r n; do
            if [ "$DRY_RUN" = true ]; then echo "would lock #$n"; continue; fi
            gh issue lock "$n" --repo "$REPO" --reason resolved
            echo "locked #$n"
          done
