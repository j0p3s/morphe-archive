name: Reply on closed issues

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  redirect:
    if: >-
      github.event.issue.state == 'closed' &&
      !github.event.issue.pull_request &&
      !github.event.issue.locked &&
      github.event.comment.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/closed_issue_comment.py
            patches-list.json
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 .github/scripts/closed_issue_comment.py "$GITHUB_EVENT_PATH" patches-list.json > "$RUNNER_TEMP/comment.md" || exit 0
          replied=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate --slurp \
            --jq '[.[][] | select(.body | contains("<!-- closed-issue-bot -->"))] | length')
          [ "$replied" = 0 ] || exit 0
          gh issue comment "$ISSUE" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
